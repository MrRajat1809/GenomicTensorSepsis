# Publishes the results page (release/) to GitHub Pages whenever it changes on main. The page is static: its data are
# written by release/build_data.py after a pipeline run and committed with it, so the workflow builds nothing.
name: Pages

on:
  push:
    branches: [main]
    paths: ['release/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: release
      - id: deployment
        uses: actions/deploy-pages@v5
